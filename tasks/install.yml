---
- name: Check if pi-hole is already installed
  ansible.builtin.stat:
    path: "/opt/pihole"
  register: pihole_installed
  tags:
    - pihole
    - installation
    - check

- name: Create pihole config directory
  become: true
  ansible.builtin.file:
    name: /etc/pihole
    state: directory
    mode: 0644
  when: pihole_installed.stat.isdir is undefined
  tags:
    - pihole
    - installation
    - prepare

- name: Check if pihole.toml exists
  become: true
  ansible.builtin.stat:
    path: /etc/pihole/pihole.toml
  register: pihole_toml_exists
  tags:
    - pihole
    - installation
    - prepare
    - configuration

- name: Generate pihole.toml to temporary location for comparison
  become: true
  ansible.builtin.template:
    src: etc/pihole/pihole.toml.j2
    dest: /tmp/pihole.toml.new
    mode: 0640
  when: pihole_toml_exists.stat.exists | default(false)
  changed_when: false
  tags:
    - pihole
    - installation
    - prepare
    - configuration

- name: Extract configuration values from existing pihole.toml (ignore comments and stats)
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    grep -v '^\s*#' /etc/pihole/pihole.toml | sed 's/\s*###.*$//' | grep -v '^$' | grep -v '^\s*$'
  args:
    executable: /bin/bash
  register: existing_config
  when: pihole_toml_exists.stat.exists | default(false)
  changed_when: false
  failed_when: false
  tags:
    - pihole
    - installation
    - prepare
    - configuration

- name: Extract configuration values from new template (ignore comments)
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    grep -v '^\s*#' /tmp/pihole.toml.new | sed 's/\s*###.*$//' | grep -v '^$' | grep -v '^\s*$'
  args:
    executable: /bin/bash
  register: new_config
  when: pihole_toml_exists.stat.exists | default(false)
  changed_when: false
  failed_when: false
  tags:
    - pihole
    - installation
    - prepare
    - configuration

# 0644 matches the mode the file actually ends up with. pihole-FTL rewrites pihole.toml
# on startup by opening pihole.toml.tmp, chowning it and renaming it into place
# (openFTLtoml/closeFTLtoml in FTL's src/config/toml_helper.c, rename() in
# toml_writer.c). The rename replaces the inode, so whatever mode is set here is
# discarded and the new file keeps its creation mode of 0666 & ~umask, i.e. 0644 under
# systemd's default UMask=0022. Declaring anything stricter would only describe a state
# that never survives the first FTL start.
- name: Copy pihole.toml
  become: true
  ansible.builtin.template:
    src: etc/pihole/pihole.toml.j2
    dest: /etc/pihole/pihole.toml
    mode: 0644
    backup: true
  when: >
    not (pihole_toml_exists.stat.exists | default(false)) or
    (existing_config.stdout | default('') != new_config.stdout | default(''))
  tags:
    - pihole
    - installation
    - prepare
    - configuration

- name: Clean up temporary template file
  become: true
  ansible.builtin.file:
    path: /tmp/pihole.toml.new
    state: absent
  when: pihole_toml_exists.stat.exists | default(false)
  changed_when: false
  tags:
    - pihole
    - installation
    - prepare
    - configuration

- name: Clone pihole repository revision {{ pi_hole_version }}
  become: true
  ansible.builtin.git:
    repo: "{{ pi_hole_repo }}"
    clone: true
    depth: 20
    dest: "{{ pi_hole_install_dir }}"
    version: "{{ pi_hole_version }}"
  when: pihole_installed.stat.isdir is undefined
  tags:
    - pihole
    - installation
    - source

- name: Install pihole
  become: true
  ansible.builtin.command: bash basic-install.sh --unattended
  args:
    chdir: "{{ pi_hole_install_dir }}/automated install"
    creates: installed.txt
  when: pihole_installed.stat.isdir is undefined
  tags:
    - pihole
    - installation
