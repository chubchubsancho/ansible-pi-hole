---
# Renders the template with its list variables set, which the default scenario never
# does: with everything at its defaults every array in pihole.toml comes out as [], so
# the {% raw %}{% if ... is defined %}{% endraw %} half of each block is untested. The
# image is still driven by $image/$version so this can be pointed at any platform, but
# CI runs it on one image only -- the branches under test are platform independent.
dependency:
  name: galaxy
  options:
    role-file: molecule/resources/requirements.yml
    requirements-file: molecule/resources/requirements.yml

driver:
  name: docker

platforms:
  - name: "instance"
    image: "$image:$version"
    # Shared with the default scenario rather than copied: it carries the RedHat sudo
    # and nsswitch fixes plus the dig install, and two copies would drift.
    dockerfile: ../default/Dockerfile.j2
    cgroupns_mode: host
    command: /sbin/init
    pre_build_image: false
    privileged: true
    groups:
      - "default"
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  log: true
  name: ansible
  inventory:
    links:
      group_vars: group_vars/
  playbooks:
    converge: ../resources/playbook.yml
  options:
    vvv: true
    diff: true

verifier:
  name: ansible
