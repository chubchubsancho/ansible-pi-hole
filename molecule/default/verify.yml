---
- name: Verify
  hosts: all
  gather_facts: false
  # The role is not imported here, so its defaults are out of scope. Read them from
  # the role itself rather than restating pi_hole_version and letting it drift.
  vars_files:
    - "{{ playbook_dir }}/../../defaults/main.yml"
    - "{{ playbook_dir }}/../../vars/main.yml"
  tasks:
    - name: Gather service facts
      become: true
      ansible.builtin.service_facts:

    - name: Assert pihole-FTL is enabled and running
      ansible.builtin.assert:
        that:
          - "'pihole-FTL.service' in ansible_facts.services"
          - ansible_facts.services['pihole-FTL.service'].state == 'running'
          - ansible_facts.services['pihole-FTL.service'].status == 'enabled'
        fail_msg: >-
          pihole-FTL is not enabled and running:
          {{ ansible_facts.services['pihole-FTL.service'] | default('service not found') }}

    - name: Stat the paths the role is responsible for
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/pihole
        - /etc/pihole/pihole.toml
        - /etc/pihole/gravity.db
      register: pihole_paths

    - name: Assert the installation left its files behind
      ansible.builtin.assert:
        that:
          - pihole_paths.results[0].stat.isdir | default(false)
          - pihole_paths.results[1].stat.exists | default(false)
          - pihole_paths.results[2].stat.exists | default(false)
        fail_msg: >-
          Missing: {{ pihole_paths.results | rejectattr('stat.exists') | map(attribute='item') | list }}

    # Deliberately not asserting pihole.toml's mode. The role templates it 0640, but
    # pihole-FTL rewrites the file on startup and creates it 0644, so the mode on a
    # converged host belongs to FTL rather than to the role.

    # Asking git rather than `pihole -v`. The revision the role controls is the one it
    # cloned, whereas `pihole -v` reports Pi-hole's own core/web/FTL versions -- and it
    # exits 2 with no output at all on AlmaLinux 9 and 10, though it works everywhere
    # else. update_repo() in basic-install.sh only resets the checkout when it is on
    # master, and the role leaves it detached at the tag, so the tag survives the install.
    - name: Read the revision the role checked out  # noqa: command-instead-of-module
      become: true
      ansible.builtin.command: git -C {{ pi_hole_install_dir }} describe --tags
      register: pihole_checkout
      changed_when: false

    - name: Assert the requested revision is the one that got checked out
      ansible.builtin.assert:
        that:
          - pi_hole_version in pihole_checkout.stdout
        fail_msg: >-
          {{ pi_hole_install_dir }} is at '{{ pihole_checkout.stdout | trim }}',
          expected it to contain {{ pi_hole_version }}

    - name: Assert Pi-hole is listening on its DNS and webserver ports
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 30
      loop:
        - 53
        - 80

    # End-to-end check of the role's actual job: a value set as a role variable has to
    # survive templating into pihole.toml and come back out of FTL as a real DNS answer.
    # The record is local to pihole.toml, so this never leaves the container and cannot
    # flake on upstream resolvers.
    - name: Resolve the custom DNS record through the local Pi-hole
      ansible.builtin.command: dig +short @127.0.0.1 {{ pi_hole_dns_hosts[0].split()[1] }} A
      register: pihole_dig
      until: pihole_dig.stdout | trim == pi_hole_dns_hosts[0].split()[0]
      retries: 10
      delay: 3
      changed_when: false
      failed_when: false

    - name: Assert Pi-hole answered with the configured address
      ansible.builtin.assert:
        that:
          - pihole_dig.stdout | trim == pi_hole_dns_hosts[0].split()[0]
        fail_msg: >-
          Querying {{ pi_hole_dns_hosts[0].split()[1] }} against 127.0.0.1 returned
          '{{ pihole_dig.stdout | trim }}', expected '{{ pi_hole_dns_hosts[0].split()[0] }}'
