name: molecule

on:
  pull_request:
    paths:
      - .github/workflows/molecule.yaml
      - "!.github/**"
      - "**"
  push:
    branches:
      - master

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Environment
        # A venv keeps the runner's apt-installed Python packages off the path; see the
        # molecule jobs below for why that matters.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install ansible-lint yamllint
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint -q .

  test:
    name: molecule test on ${{ matrix.image }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu
            version: "22.04"
          - image: ubuntu
            version: "24.04"
          - image: ubuntu
            version: "26.04"
          - image: debian
            version: "12"
          - image: debian
            version: "13"
          - image: almalinux
            version: "9"
          - image: almalinux
            version: "10"
          - image: fedora
            version: "42"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Environment
        # Install into a venv rather than the user site. molecule loads every driver
        # molecule-plugins ships, and the ec2 one imports boto3; outside a venv that
        # resolves to the runner's apt-installed boto3 and pyOpenSSL, which break against
        # the newer cryptography pip pulls in.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install molecule molecule-plugins[docker] ansible-lint yamllint
      - name: molecule test
        env:
          image: ${{ matrix.image }}
          version: ${{ matrix.version }}
        run: |
          molecule test

  custom-config:
    # Renders the template with its list variables set. Those branches are platform
    # independent, so one image is enough rather than another nine-way matrix.
    name: molecule custom-config on debian 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Environment
        # Install into a venv rather than the user site. molecule loads every driver
        # molecule-plugins ships, and the ec2 one imports boto3; outside a venv that
        # resolves to the runner's apt-installed boto3 and pyOpenSSL, which break against
        # the newer cryptography pip pulls in.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install molecule molecule-plugins[docker] ansible-lint yamllint
      - name: molecule test -s custom-config
        env:
          image: debian
          version: "12"
        run: |
          molecule test -s custom-config
